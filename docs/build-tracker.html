<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flowstate v1 — Build Tracker</title>
    <style>
      :root {
        --bg: #e7e8ec;
        --surface: #ffffff;
        --surface-2: #f1f2f5;
        --ink: #1d1d1f;
        --ink-2: #6e6e73;
        --ink-3: #86868b;
        --line: #ececef;
        --line-2: #e0e2e6;
        --accent: #007aff;
        --accent-soft: #eef4ff;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        --shadow-lg: 0 4px 16px rgba(0, 0, 0, 0.07);
        /* status: deep text · tint bg · bright solid (Apple system colors) */
        --s-todo: #6e6e73;   --s-todo-bg: #eceef0;   --s-todo-solid: #8e8e93;
        --s-wip: #a85400;    --s-wip-bg: #ffeeda;    --s-wip-solid: #ff9500;
        --s-review: #0058c7; --s-review-bg: #e3f0ff; --s-review-solid: #007aff;
        --s-blocked: #d70015;--s-blocked-bg: #ffe5e3;--s-blocked-solid: #ff3b30;
        --s-done: #248a3d;   --s-done-bg: #e3f7e8;   --s-done-solid: #34c759;
        --s-deferred: #8944ab;--s-deferred-bg: #f4e9fb;--s-deferred-solid: #af52de;
        --s-parked: #6e6e73; --s-parked-bg: #eceef0; --s-parked-solid: #8e8e93;
      }
      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI",
          Roboto, Helvetica, Arial, sans-serif;
        font-size: 15px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .wrap { max-width: 1200px; margin: 0 auto; padding: 30px 24px 90px; }

      header.top {
        display: flex; align-items: flex-start; justify-content: space-between;
        gap: 18px; flex-wrap: wrap; margin-bottom: 4px;
      }
      h1 { font-size: 23px; letter-spacing: -0.02em; margin: 0 0 3px; font-weight: 700; }
      .subtitle { color: var(--ink-2); font-size: 13.5px; max-width: 620px; }
      .toolbar { display: flex; gap: 7px; flex-wrap: wrap; align-items: center; }
      button, select, input, textarea { font-family: inherit; font-size: 14px; color: var(--ink); }
      .btn {
        background: var(--surface); border: 1px solid var(--line-2); border-radius: 8px;
        padding: 7px 12px; cursor: pointer; color: var(--ink-2); box-shadow: var(--shadow);
        transition: all 0.13s ease; font-weight: 500;
      }
      .btn:hover { background: var(--surface-2); color: var(--ink); border-color: var(--ink-3); transform: translateY(-1px); }
      .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
      .btn.primary:hover { filter: brightness(1.08); color: #fff; }

      /* rollup cards */
      .stats {
        display: grid; grid-template-columns: repeat(auto-fit, minmax(158px, 1fr));
        gap: 12px; margin: 22px 0 6px;
      }
      .stat {
        background: var(--surface); border: 1px solid var(--line); border-radius: 13px;
        padding: 15px 16px; box-shadow: var(--shadow); position: relative; overflow: hidden;
      }
      .stat.hero { grid-column: span 1; }
      .stat .k {
        font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em;
        color: var(--ink-3); margin-bottom: 6px; font-weight: 600;
      }
      .stat .v { font-size: 27px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.05; }
      .stat .v small { font-size: 14px; color: var(--ink-3); font-weight: 500; letter-spacing: 0; }
      .stat .sub { font-size: 11.5px; color: var(--ink-3); margin-top: 5px; }
      .bar { height: 7px; border-radius: 5px; background: var(--surface-2); overflow: hidden; margin-top: 11px; }
      .bar > span { display: block; height: 100%; border-radius: 5px; transition: width 0.3s ease; }
      .bar.done > span { background: var(--s-done-solid); }
      .bar.cut > span { background: var(--accent); }
      .chips { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 9px; }
      .chip { font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; }

      /* filters */
      .filters {
        display: flex; gap: 9px; align-items: center; flex-wrap: wrap;
        margin: 22px 0 12px; color: var(--ink-2); font-size: 13px;
      }
      .filters select, .filters input[type="search"] {
        background: var(--surface); border: 1px solid var(--line-2); border-radius: 8px; padding: 6px 10px;
      }
      .filters input[type="search"] { min-width: 190px; }
      .filters label { display: inline-flex; gap: 5px; align-items: center; cursor: pointer; }
      .filters .count { margin-left: auto; color: var(--ink-3); font-size: 12.5px; }

      /* one merged table */
      .table-card {
        background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
        box-shadow: var(--shadow-lg); overflow: hidden;
      }
      .table-scroll { overflow-x: auto; }
      table { width: 100%; border-collapse: collapse; }
      thead th {
        position: sticky; top: 0; z-index: 2;
        font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-3);
        text-align: left; font-weight: 700; padding: 12px 14px;
        background: var(--surface-2); border-bottom: 1px solid var(--line-2); white-space: nowrap;
      }
      th.r, td.r { text-align: right; }

      tr.phase-row td {
        background: var(--accent-soft); padding: 10px 14px;
        border-top: 1px solid var(--line-2); border-bottom: 1px solid var(--line-2);
      }
      tr.phase-row:first-child td { border-top: none; }
      .phase-row .ph-name { font-weight: 700; font-size: 13px; letter-spacing: -0.01em; color: var(--ink); }
      .phase-row .ph-meta { float: right; font-size: 12px; color: var(--ink-2); font-weight: 500; }
      .phase-row .ph-bar { display: inline-block; width: 90px; height: 5px; border-radius: 3px; background: var(--line-2); overflow: hidden; vertical-align: middle; margin-left: 10px; }
      .phase-row .ph-bar > span { display: block; height: 100%; background: var(--s-done-solid); border-radius: 3px; }

      tbody td { padding: 12px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
      tbody tr.item:hover td { background: var(--surface-2); }
      tbody tr.item.done td:not(.c-status) { opacity: 0.58; }
      tbody tr.item.deferred td:not(.c-status), tbody tr.item.parked td:not(.c-status) { opacity: 0.5; }

      .c-id { width: 60px; border-left: 3px solid transparent; }
      .c-id .id { font-weight: 700; font-size: 13.5px; }
      .c-id .pr { display: block; font-size: 11px; color: var(--ink-3); margin-top: 1px; }
      .c-item { min-width: 300px; }
      .c-item .t { font-weight: 600; font-size: 14.5px; letter-spacing: -0.01em; }
      .c-item .d { color: var(--ink-2); font-size: 12.5px; margin-top: 3px; line-height: 1.45; }
      .c-deps { color: var(--ink-3); font-size: 12px; white-space: nowrap; }
      .c-est, .c-act { width: 96px; }
      .c-status { width: 188px; }
      .c-x { width: 34px; }

      input.num {
        width: 62px; text-align: right; background: transparent; border: 1px solid transparent;
        border-radius: 7px; padding: 5px 7px; font-size: 14px; font-variant-numeric: tabular-nums;
      }
      input.num:hover { border-color: var(--line-2); background: var(--bg); }
      input.num:focus { outline: none; border-color: var(--accent); background: var(--bg); }

      select.status {
        width: 100%; min-width: 150px; border-radius: 999px; padding: 6px 13px; border: 1px solid transparent;
        font-size: 12.5px; font-weight: 600; cursor: pointer;
        -webkit-appearance: none; appearance: none; text-align: left;
        white-space: nowrap; text-overflow: clip;
      }
      .rm { border: none; background: transparent; color: var(--ink-3); cursor: pointer; font-size: 17px; line-height: 1; padding: 2px 6px; border-radius: 6px; }
      .rm:hover { color: var(--s-blocked); background: var(--s-blocked-bg); }

      tr.cutline-row td {
        background: var(--surface-2);
        color: var(--ink-2); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.1em;
        font-weight: 700; text-align: center; padding: 8px; border-top: 1px dashed var(--line-2);
        border-bottom: 1px dashed var(--line-2);
      }

      /* daily log */
      .log { margin-top: 30px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; box-shadow: var(--shadow); }
      .log h2 { font-size: 15px; margin: 0 0 12px; font-weight: 650; }
      .log .compose { display: flex; gap: 9px; align-items: flex-start; }
      .log textarea { flex: 1; min-height: 44px; resize: vertical; background: var(--bg); border: 1px solid var(--line-2); border-radius: 9px; padding: 9px 12px; color: var(--ink); font-size: 14px; }
      .log textarea:focus { outline: none; border-color: var(--accent); }
      .log .entries { margin-top: 15px; }
      .log .entry { padding: 9px 0; border-top: 1px solid var(--line); font-size: 14px; display: flex; gap: 14px; }
      .log .entry .date { color: var(--accent); font-size: 12px; font-weight: 600; min-width: 92px; flex-shrink: 0; }
      .log .entry .txt { white-space: pre-wrap; color: var(--ink-2); }
      .log .entry .del { margin-left: auto; opacity: 0; }
      .log .entry:hover .del { opacity: 1; }

      footer.meta { margin-top: 26px; color: var(--ink-3); font-size: 12px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
      @media (max-width: 760px) { .c-deps { display: none; } }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header class="top">
        <div>
          <h1>Flowstate v1 — Build Tracker</h1>
          <div class="subtitle">
            Live status against <span class="mono">docs/v1-scope.md</span>. Edits
            auto-save to this browser — Export or Save&nbsp;HTML to keep a copy.
          </div>
        </div>
        <div class="toolbar">
          <button class="btn" id="addBtn">+ Item</button>
          <button class="btn" id="exportBtn">Export JSON</button>
          <button class="btn" id="importBtn">Import</button>
          <button class="btn" id="downloadHtmlBtn">Save HTML</button>
          <input type="file" id="importFile" accept="application/json" style="display: none" />
        </div>
      </header>

      <section class="stats" id="stats"></section>

      <div class="filters">
        <select id="fStatus">
          <option value="">All statuses</option>
          <option value="todo">Not started</option>
          <option value="wip">In progress</option>
          <option value="review">In review</option>
          <option value="blocked">Blocked</option>
          <option value="done">Done</option>
          <option value="deferred">v1.1 / Deferred</option>
          <option value="parked">Parked</option>
        </select>
        <input type="search" id="fSearch" placeholder="Search items…" />
        <label><input type="checkbox" id="fHideDone" /> hide done</label>
        <label><input type="checkbox" id="fHideDeferred" /> hide deferred</label>
        <span class="count mono" id="count"></span>
      </div>

      <div class="table-card">
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Item</th>
                <th class="c-deps">Dependencies</th>
                <th class="r">Estimate&nbsp;(h)</th>
                <th>Status</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
      </div>

      <section class="log">
        <h2>Daily log</h2>
        <div class="compose">
          <textarea id="logInput" placeholder="What moved today? (e.g. 'Started W4 — invoice draft data model, ~2h. Blocked on the rounding rule.')"></textarea>
          <button class="btn primary" id="logBtn">Log today</button>
        </div>
        <div class="entries" id="logEntries"></div>
      </section>

      <footer class="meta">
        <span id="savedAt"></span>
        <span>Data lives in this browser + your exports. “Save HTML” bakes today’s data into a fresh copy of this file.</span>
      </footer>
    </div>

    <script>
      // ============================================================
      //  SEED — canonical starting state, from docs/v1-scope.md + git.
      // ============================================================
      const SEED = /*SEED_START*/ {
        "meta": { "version": 2, "title": "Flowstate v1 — Build Tracker" },
        "phases": [
          "P-1 · Land the boundary",
          "P0 · Clear the decks",
          "P1 · Clients + rates",
          "P2 · Time, honestly",
          "P3 · Get paid (money)",
          "P4 · Direction",
          "P5 · Mechanics that change Tuesday",
          "Below the cut line",
          "v1.1"
        ],
        "cutAfterPhase": "P5 · Mechanics that change Tuesday",
        "items": [
          { "id": "W0", "phase": "P-1 · Land the boundary", "title": "Land the boundary — orgs + tenancy classification", "desc": "orgs, org_memberships, org-resolving tRPC context, tenancy.ts with a failing test if a table is unclassified.", "deps": "—", "est": 2, "act": 0, "status": "done", "pr": "#262" },
          { "id": "W12", "phase": "P0 · Clear the decks", "title": "Teardown — delete the pre-mission feature set", "desc": "Remove all KILL items: routes, routers, tables, components, tests, RLS. Forward-only migrations.", "deps": "—", "est": 12, "act": 0, "status": "done", "pr": "#264" },
          { "id": "W13", "phase": "P0 · Clear the decks", "title": "Flags + park plumbing", "desc": "src/lib/flags.ts; Care, Chat, Focus parked off with zero UI trace.", "deps": "W12", "est": 4, "act": 0, "status": "done", "pr": "#265" },
          { "id": "W1", "phase": "P1 · Clients + rates", "title": "Data reshape — clients, rates, category collapse", "desc": "clients + financial-class rates tables; projects gain client_id/state/is_maintenance; category → business|personal; /clients list+detail.", "deps": "W0", "est": 16, "act": 0, "status": "done", "pr": "#267" },
          { "id": "W1.5", "phase": "P1 · Clients + rates", "title": "Lay the Draw-panel pipe", "desc": "business_expenses (financial-class) + money-settings fields (tax %, cost-of-living, savings, cash balances). Schema only; W16 consumes it.", "deps": "W1", "est": 2, "act": 0, "status": "done", "pr": "#268" },
          { "id": "W11", "phase": "P1 · Clients + rates", "title": "Personal category", "desc": "One Maintenance project holds personal work; excluded from every goal-layer query. Folded into W1.", "deps": "W1", "est": 0, "act": 0, "status": "done", "pr": "#267" },
          { "id": "W2a", "phase": "P2 · Time, honestly", "title": "Rename task_time_entries → time_entries + reshape", "desc": "project_id NOT NULL, task_id nullable, billable, source, tag_id, invoiced_at. Backfill, mirror.", "deps": "W1", "est": 4, "act": 0, "status": "done", "pr": "#269" },
          { "id": "W2b", "phase": "P2 · Time, honestly", "title": "Project-first timer core (Today header)", "desc": "Pick project, type description, start < 2s. One timer at a time. Start-time authoritative, survives quit/sleep/midnight.", "deps": "W2a", "est": 6, "act": 0, "status": "done", "pr": "#270" },
          { "id": "W2c", "phase": "P2 · Time, honestly", "title": "End-of-day gap fill", "desc": "Close lists untracked spans > 15m; one-click assign to a recent project or dismiss.", "deps": "W2b", "est": 4, "act": 0, "status": "done", "pr": "#271" },
          { "id": "W2d", "phase": "P2 · Time, honestly", "title": "Threshold notifications", "desc": "Billing threshold, long-running timer, over-estimate, weekly hours. Once per crossing, each switchable off.", "deps": "W2b", "est": 6, "act": 0, "status": "done", "pr": "#272–274" },
          { "id": "W2e", "phase": "P2 · Time, honestly", "title": "Time-tags + CSV export", "desc": "Controlled tag list managed in Settings; CSV of raw entries for any period.", "deps": "W2a", "est": 4, "act": 0, "status": "done", "pr": "#275" },
          { "id": "W2f", "phase": "P2 · Time, honestly", "title": "Menu-bar timer + idle detection (Tauri)", "desc": "Always-visible menu-bar timer (start/stop/switch); 10-min idle → keep/trim with trim preselected.", "deps": "W2b", "est": 6, "act": 0, "status": "todo", "pr": "" },
          { "id": "W3", "phase": "P3 · Get paid (money)", "title": "Time reporting", "desc": "Money section: period picker, billable/non-billable split, client→project→task grouping, effective rate, CSV.", "deps": "W2", "est": 10, "act": 0, "status": "done", "pr": "#276" },
          { "id": "W4", "phase": "P3 · Get paid (money)", "title": "Proposed invoices", "desc": "Per-client draft (oldest 20h first), 6–12 client-facing line items, carry-forward, invoiced_at unique index, Markdown+CSV. Threshold-primary + monthly backstop trigger. Tier-0 tax reserve line here.", "deps": "W1, W3", "est": 16, "act": 0, "status": "done", "pr": "#286, #288" },
          { "id": "W16", "phase": "P3 · Get paid (money)", "title": "The Draw panel (personal + business money)", "desc": "Running cash ledger (paid invoices − expenses − draws), available-to-draw, tax reserve, business + personal runway, minimum draw, CSV expense import. Roll-ups, never transactions. A section of Money.", "deps": "W1.5, W3, W4", "est": 14, "act": 0, "status": "done", "pr": "#289" },
          { "id": "W5", "phase": "P4 · Direction", "title": "Directions, Targets & Quarter surface", "desc": "The Quarter surface at /plan: Directions (never measured, applied line) + Targets (direction FK, horizon, hybrid measure source, cap-3 as retire-one UX, archive-on-met) + Learning roadmap (a business project Quarter reads) + full quarterly review (in-place banner) + tool-spend/compliance read-strips + smart composer + guided first-run. Grew from 18h — see discovery-quarter.md §13.", "deps": "W1", "est": 34, "act": 0, "status": "todo", "pr": "" },
          { "id": "W6", "phase": "P5 · Mechanics that change Tuesday", "title": "The Budget", "desc": "Declared tilt (e.g. 70/30); Today shows a live bar of minutes logged today, never task counts. Never blocks or nags.", "deps": "W2, W5", "est": 10, "act": 0, "status": "todo", "pr": "" },
          { "id": "W7", "phase": "P5 · Mechanics that change Tuesday", "title": "The Sweep", "desc": "Weekly Week section: stale tasks/projects/targets, drop/park/keep, finite (20 + N more), keep buys a month, pre-answered.", "deps": "W1, W5", "est": 10, "act": 0, "status": "todo", "pr": "" },
          { "id": "W14", "phase": "P5 · Mechanics that change Tuesday", "title": "The Week steering deck", "desc": "2×2 deck: Waiting on you / The bets / Coming up / Gone quiet + off-target banner. Assembles, doesn't duplicate. Spec done (§8f).", "deps": "W5, W6, W7", "est": 10, "act": 0, "status": "todo", "pr": "" },
          { "id": "W15", "phase": "P5 · Mechanics that change Tuesday", "title": "Project planning & estimate-vs-actual", "desc": "template→phases→per-phase estimate+deadline; billing_type (hourly|fixed_fee); off-track = budget consumed ahead of work done; burn on detail/board/Week + one notification.", "deps": "W1, W2", "est": 13, "act": 0, "status": "todo", "pr": "" },
          { "id": "W8", "phase": "Below the cut line", "title": "The Ledger", "desc": "Every 2nd Friday, Money section: said-vs-spent tilt over the fortnight, per client/project. Waits to be opened. Kept in v1 (discovery-quarter §13 Q8 — Filter extends v1 rather than displacing the Ledger).", "deps": "W6", "est": 8, "act": 0, "status": "todo", "pr": "" },
          { "id": "W10", "phase": "P4 · Direction", "title": "The Filter (self-scored, cut version)", "desc": "Eight Fit/Risk/Strategy questions → pursue/negotiate/decline vs active Direction+Target, logged overrides, decline-outright escape. Public intake link is v1.1. Pulled above the cut (discovery-quarter) so the Direction applied-line is live in v1; sequence right after W5.", "deps": "W1, W5", "est": 10, "act": 0, "status": "todo", "pr": "" },
          { "id": "Tickler", "phase": "Below the cut line", "title": "Business tickler", "desc": "Compliance dates fire on Today on the trigger date only; otherwise invisible. ~6h once Today has a due strip.", "deps": "W1", "est": 6, "act": 0, "status": "todo", "pr": "" },
          { "id": "W9", "phase": "v1.1", "title": "Client onboarding automation", "desc": "Local folder tree + starter contracts + project + phases + checklist, opened in Finder. Displaced by W16. 'Signed' still creates client+project+phases in v1.", "deps": "W1, W2", "est": 12, "act": 0, "status": "deferred", "pr": "" }
        ],
        "log": []
      } /*SEED_END*/;

      // ============================================================
      const STORE_KEY = "flowstate-build-tracker-v2";
      const STATUS = {
        todo: { label: "Not started", fg: "--s-todo", bg: "--s-todo-bg", solid: "--s-todo-solid", pct: 0 },
        wip: { label: "In progress", fg: "--s-wip", bg: "--s-wip-bg", solid: "--s-wip-solid", pct: 0.5 },
        review: { label: "In review", fg: "--s-review", bg: "--s-review-bg", solid: "--s-review-solid", pct: 0.85 },
        blocked: { label: "Blocked", fg: "--s-blocked", bg: "--s-blocked-bg", solid: "--s-blocked-solid", pct: 0.25 },
        done: { label: "Done", fg: "--s-done", bg: "--s-done-bg", solid: "--s-done-solid", pct: 1 },
        deferred: { label: "v1.1 / Deferred", fg: "--s-deferred", bg: "--s-deferred-bg", solid: "--s-deferred-solid", pct: 0 },
        parked: { label: "Parked", fg: "--s-parked", bg: "--s-parked-bg", solid: "--s-parked-solid", pct: 0 },
      };

      let state = load();

      function load() {
        try {
          const raw = localStorage.getItem(STORE_KEY);
          if (raw) return JSON.parse(raw);
          const old = localStorage.getItem("flowstate-build-tracker-v1");
          if (old) return JSON.parse(old);
        } catch (e) {}
        return structuredClone(SEED);
      }
      function save() {
        try {
          localStorage.setItem(STORE_KEY, JSON.stringify(state));
          document.getElementById("savedAt").textContent = "Saved " + new Date().toLocaleString();
        } catch (e) {
          document.getElementById("savedAt").textContent = "⚠ Could not save to this browser — use Export to keep your data.";
        }
      }
      const today = () => new Date().toISOString().slice(0, 10);
      const esc = (s) => (s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

      function computeStats() {
        const items = state.items;
        const inScope = items.filter((i) => i.status !== "deferred" && i.status !== "parked");
        const totalEst = inScope.reduce((s, i) => s + (+i.est || 0), 0);
        const doneEst = inScope.filter((i) => i.status === "done").reduce((s, i) => s + (+i.est || 0), 0);
        const weightedDone = inScope.reduce((s, i) => s + (+i.est || 0) * (STATUS[i.status]?.pct ?? 0), 0);
        const remaining = totalEst - doneEst;
        const cutIdx = state.phases.indexOf(state.cutAfterPhase);
        const cutPhases = state.phases.slice(0, cutIdx + 1);
        const cut = inScope.filter((i) => cutPhases.includes(i.phase));
        const cutEst = cut.reduce((s, i) => s + (+i.est || 0), 0);
        const cutDone = cut.filter((i) => i.status === "done").reduce((s, i) => s + (+i.est || 0), 0);
        const byStatus = {};
        for (const k of Object.keys(STATUS)) byStatus[k] = items.filter((i) => i.status === k).length;
        return {
          totalEst, doneEst, weightedDone, remaining, cutEst, cutDone,
          pct: totalEst ? Math.round((doneEst / totalEst) * 100) : 0,
          wpct: totalEst ? Math.round((weightedDone / totalEst) * 100) : 0,
          cutPct: cutEst ? Math.round((cutDone / cutEst) * 100) : 0,
          byStatus,
        };
      }

      function renderStats() {
        const s = computeStats();
        const chip = (k) => `<span class="chip" style="color:var(${STATUS[k].fg});background:var(${STATUS[k].bg})">${s.byStatus[k]} ${STATUS[k].label.replace(" / Deferred", "")}</span>`;
        document.getElementById("stats").innerHTML =
          `<div class="stat hero"><div class="k">Cut-line v1 · P-1…P5</div><div class="v">${s.cutPct}%</div><div class="bar cut"><span style="width:${s.cutPct}%"></span></div><div class="sub">${s.cutDone} / ${s.cutEst} h — the shippable v1</div></div>` +
          `<div class="stat hero"><div class="k">All-in v1</div><div class="v">${s.pct}%<small> &nbsp;· ${s.wpct}% weighted</small></div><div class="bar done"><span style="width:${s.pct}%"></span></div><div class="sub">${s.doneEst} / ${s.totalEst} h incl. below-cut</div></div>` +
          `<div class="stat"><div class="k">Hours remaining</div><div class="v">${s.remaining}<small> h</small></div><div class="sub">of ${s.totalEst} h all-in</div></div>` +
          `<div class="stat"><div class="k">Below cut line</div><div class="v">${s.totalEst - s.cutEst}<small> h</small></div><div class="sub">Ledger · Filter · Tickler</div></div>` +
          `<div class="stat"><div class="k">By status</div><div class="chips">${chip("done")}${chip("wip")}${chip("todo")}${chip("blocked")}</div></div>`;
      }

      function passesFilter(i) {
        const fs = document.getElementById("fStatus").value;
        const q = document.getElementById("fSearch").value.trim().toLowerCase();
        const hd = document.getElementById("fHideDone").checked;
        const hdef = document.getElementById("fHideDeferred").checked;
        if (fs && i.status !== fs) return false;
        if (hd && i.status === "done") return false;
        if (hdef && (i.status === "deferred" || i.status === "parked")) return false;
        if (q && !(`${i.id} ${i.title} ${i.desc}`.toLowerCase().includes(q))) return false;
        return true;
      }

      function statusSelect(i) {
        const cur = STATUS[i.status] || STATUS.todo;
        const opts = Object.entries(STATUS).map(([k, v]) => `<option value="${k}" ${k === i.status ? "selected" : ""}>${v.label}</option>`).join("");
        return `<select class="status" data-id="${i.id}" data-f="status" style="color:var(${cur.fg});background-color:var(${cur.bg})">${opts}</select>`;
      }

      function renderBoard() {
        const tb = document.getElementById("tbody");
        let html = "";
        let shown = 0;
        const cutIdx = state.phases.indexOf(state.cutAfterPhase);

        state.phases.forEach((phase, pIdx) => {
          const all = state.items.filter((i) => i.phase === phase);
          if (all.length === 0) return;
          const items = all.filter(passesFilter);
          const phEst = all.reduce((s, i) => s + (+i.est || 0), 0);
          const phDone = all.filter((i) => i.status === "done").reduce((s, i) => s + (+i.est || 0), 0);
          const phPct = phEst ? Math.round((phDone / phEst) * 100) : 0;

          if (items.length) {
            html += `<tr class="phase-row"><td colspan="6"><span class="ph-name">${esc(phase)}</span><span class="ph-meta">${phDone}/${phEst} h · ${phPct}%<span class="ph-bar"><span style="width:${phPct}%"></span></span></span></td></tr>`;
            shown += items.length;
            for (const i of items) {
              const cur = STATUS[i.status] || STATUS.todo;
              const cls = ["done", "deferred", "parked"].includes(i.status) ? i.status : "";
              html += `<tr class="item ${cls}" data-row="${i.id}">
                <td class="c-id mono" style="border-left-color:var(${cur.solid})"><span class="id">${esc(i.id)}</span><span class="pr">${esc(i.pr || "")}</span></td>
                <td class="c-item"><div class="t">${esc(i.title)}</div><div class="d">${esc(i.desc)}</div></td>
                <td class="c-deps mono">${esc(i.deps || "—")}</td>
                <td class="c-est r"><input class="num mono" type="number" min="0" step="0.5" value="${i.est}" data-id="${i.id}" data-f="est"></td>
                <td class="c-status">${statusSelect(i)}</td>
                <td class="c-x"><button class="rm" data-del="${i.id}" title="Remove">×</button></td>
              </tr>`;
            }
          }
          if (pIdx === cutIdx) {
            html += `<tr class="cutline-row"><td colspan="6">cut line — a coherent v1 ships above this</td></tr>`;
          }
        });

        tb.innerHTML = html;
        document.getElementById("count").textContent = shown + " shown / " + state.items.length + " total";
      }

      function renderLog() {
        document.getElementById("logEntries").innerHTML = (state.log || [])
          .map((e, idx) => `<div class="entry"><span class="date mono">${esc(e.date)}</span><span class="txt">${esc(e.text)}</span><button class="rm del" data-logdel="${idx}" title="Delete">×</button></div>`)
          .join("");
      }

      function renderAll() { renderStats(); renderBoard(); renderLog(); }

      document.getElementById("tbody").addEventListener("input", (e) => {
        const t = e.target, id = t.dataset.id, f = t.dataset.f;
        if (!id || !f) return;
        const item = state.items.find((x) => x.id === id);
        if (!item) return;
        item[f] = f === "est" ? +t.value : t.value;
        save();
        if (f === "status") {
          const cur = STATUS[item.status] || STATUS.todo;
          t.style.color = `var(${cur.fg})`;
          t.style.backgroundColor = `var(${cur.bg})`;
          const row = document.querySelector(`tr[data-row="${id}"]`);
          if (row) {
            row.className = "item " + (["done", "deferred", "parked"].includes(item.status) ? item.status : "");
            const idCell = row.querySelector(".c-id");
            if (idCell) idCell.style.borderLeftColor = `var(${cur.solid})`;
          }
          renderStats();
        } else if (f === "est") {
          renderStats();
        }
      });

      document.getElementById("tbody").addEventListener("click", (e) => {
        const del = e.target.dataset.del;
        if (del) {
          const item = state.items.find((x) => x.id === del);
          if (confirm(`Remove ${del} — ${item?.title || ""}?`)) {
            state.items = state.items.filter((x) => x.id !== del);
            save();
            renderAll();
          }
        }
      });

      document.getElementById("logEntries").addEventListener("click", (e) => {
        const d = e.target.dataset.logdel;
        if (d != null) { state.log.splice(+d, 1); save(); renderLog(); }
      });
      document.getElementById("logBtn").addEventListener("click", () => {
        const inp = document.getElementById("logInput");
        const text = inp.value.trim();
        if (!text) return;
        state.log = state.log || [];
        state.log.unshift({ date: today(), text });
        inp.value = "";
        save();
        renderLog();
      });
      ["fStatus", "fSearch", "fHideDone", "fHideDeferred"].forEach((id) =>
        document.getElementById(id).addEventListener("input", renderBoard)
      );
      document.getElementById("addBtn").addEventListener("click", () => {
        const id = prompt("Short ID (e.g. W17):", "W" + (state.items.length + 1));
        if (!id) return;
        const title = prompt("Title:", "") || "Untitled";
        const phase = prompt("Phase (one of: " + state.phases.join(" / ") + "):", state.phases[0]) || state.phases[0];
        state.items.push({ id, phase, title, desc: "", deps: "", est: 0, act: 0, status: "todo", pr: "" });
        save();
        renderAll();
      });
      document.getElementById("exportBtn").addEventListener("click", () =>
        downloadFile("flowstate-build-tracker-" + today() + ".json", JSON.stringify(state, null, 2), "application/json")
      );
      document.getElementById("importBtn").addEventListener("click", () => document.getElementById("importFile").click());
      document.getElementById("importFile").addEventListener("change", (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const r = new FileReader();
        r.onload = () => { try { state = JSON.parse(r.result); save(); renderAll(); } catch (err) { alert("Could not parse that file."); } };
        r.readAsText(file);
      });
      document.getElementById("downloadHtmlBtn").addEventListener("click", () => {
        const html = document.documentElement.outerHTML;
        const baked = html.replace(/\/\*SEED_START\*\/[\s\S]*?\/\*SEED_END\*\//, "/*SEED_START*/ " + JSON.stringify(state, null, 2) + " /*SEED_END*/");
        downloadFile("build-tracker.html", "<!doctype html>\n" + baked, "text/html");
      });
      function downloadFile(name, content, type) {
        const blob = new Blob([content], { type });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = name;
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      }

      renderAll();
      save();
    </script>
  </body>
</html>
